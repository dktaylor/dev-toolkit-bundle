name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Quality (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.4']

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      # `composer install` runs @install-tools, which installs the isolated tools/ (PHPStan, PHP-CS-Fixer).
      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      - name: Static analysis (PHPStan)
        run: composer phpstan

      - name: Coding standards (PHP-CS-Fixer)
        run: composer cs-check

      - name: Unit tests
        run: composer test